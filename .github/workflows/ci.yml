name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (host)
        run: make

      - name: Smoke test
        run: |
          ./build/local_api &
          SERVER_PID=$!
          sleep 2
          bash test_api.sh 127.0.0.1 8080
          kill $SERVER_PID

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
          add-to-path: false

      - name: Build with ndk-build (arm64-v8a)
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            -j$(nproc)
          echo "Build complete: $(ls -lh libs/arm64-v8a/local_api)"

      - name: Verify binary
        run: |
          file libs/arm64-v8a/local_api
          file libs/arm64-v8a/local_api | grep -q "ELF 64-bit.*aarch64" && echo "✓ ARM64 binary verified" || (echo "✗ Not an ARM64 binary"; exit 1)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-api-android-arm64-v8a
          path: libs/arm64-v8a/local_api
          retention-days: 7

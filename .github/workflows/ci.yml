name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake, host)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (host)
        run: cmake --build build -j$(nproc)

      - name: Smoke test
        run: |
          ./build/local_api &
          SERVER_PID=$!
          sleep 2
          bash test_api.sh 127.0.0.1 8080
          kill $SERVER_PID

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b
          add-to-path: false

      - name: Configure (CMake, android arm64-v8a)
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build (android arm64-v8a)
        run: cmake --build build-android -j$(nproc)

      - name: Verify binary
        run: |
          file build-android/local_api
          file build-android/local_api | grep -q "ELF 64-bit.*aarch64" && echo "✓ ARM64 binary verified" || (echo "✗ Not an ARM64 binary"; exit 1)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-api-android-arm64-v8a
          path: build-android/local_api
          retention-days: 7
